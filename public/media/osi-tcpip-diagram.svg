<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <rect width="800" height="420" rx="20" fill="#0B0B1E"/>
  <rect x="12" y="12" width="776" height="396" rx="14" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" fill="#F8FAFC" font-family="sans-serif" font-size="20" font-weight="bold">Comparativa Modelo OSI vs Arquitectura TCP/IP</text>
  
  <!-- Left Column: OSI -->
  <text x="210" y="82" text-anchor="middle" fill="#A78BFA" font-family="sans-serif" font-size="14" font-weight="bold">MODELO OSI (7 Capas)</text>
  <rect x="70" y="96" width="280" height="36" rx="8" fill="#4C1D95" stroke="#8B5CF6"/>
  <text x="210" y="119" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">7. Aplicación (HTTP, DNS, SSH)</text>
  <rect x="70" y="138" width="280" height="36" rx="8" fill="#4C1D95" stroke="#8B5CF6"/>
  <text x="210" y="161" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">6. Presentación (TLS/SSL, Cifrado)</text>
  <rect x="70" y="180" width="280" height="36" rx="8" fill="#4C1D95" stroke="#8B5CF6"/>
  <text x="210" y="203" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">5. Sesión (Sockets, RPC)</text>
  <rect x="70" y="222" width="280" height="38" rx="8" fill="#0E7490" stroke="#22D3EE"/>
  <text x="210" y="246" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">4. Transporte (TCP / UDP • Puertos)</text>
  <rect x="70" y="266" width="280" height="38" rx="8" fill="#065F46" stroke="#34D399"/>
  <text x="210" y="290" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">3. Red (IPv4, IPv6, ICMP, OSPF)</text>
  <rect x="70" y="310" width="280" height="36" rx="8" fill="#78350F" stroke="#FBBF24"/>
  <text x="210" y="333" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">2. Enlace de Datos (MAC, VLAN, ARP)</text>
  <rect x="70" y="352" width="280" height="36" rx="8" fill="#78350F" stroke="#FBBF24"/>
  <text x="210" y="375" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">1. Física (Fibra, UTP, RF)</text>

  <!-- Right Column: TCP/IP -->
  <text x="580" y="82" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="bold">SUITE TCP/IP (4 Capas)</text>
  <rect x="440" y="96" width="280" height="120" rx="10" fill="#3B0764" stroke="#A855F7" stroke-width="1.5"/>
  <text x="580" y="152" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">Capa de Aplicación</text>
  <text x="580" y="174" text-anchor="middle" fill="#DDD6FE" font-family="sans-serif" font-size="12">Datos / Payload de Usuario</text>

  <rect x="440" y="222" width="280" height="38" rx="8" fill="#164E63" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="580" y="246" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Capa de Transporte (Segmentos)</text>

  <rect x="440" y="266" width="280" height="38" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="580" y="290" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Capa de Internet (Paquetes IP)</text>

  <rect x="440" y="310" width="280" height="78" rx="10" fill="#451A03" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="580" y="346" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Acceso a la Red (Tramas / Bits)</text>
  <text x="580" y="366" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-size="12">Ethernet 802.3 / Wi-Fi 802.11</text>

  <!-- Connectors -->
  <line x1="360" y1="156" x2="430" y2="156" stroke="#A855F7" stroke-dasharray="5 4" stroke-width="2"/>
  <line x1="360" y1="241" x2="430" y2="241" stroke="#22D3EE" stroke-dasharray="5 4" stroke-width="2"/>
  <line x1="360" y1="285" x2="430" y2="285" stroke="#34D399" stroke-dasharray="5 4" stroke-width="2"/>
  <line x1="360" y1="349" x2="430" y2="349" stroke="#FBBF24" stroke-dasharray="5 4" stroke-width="2"/>
</svg>
